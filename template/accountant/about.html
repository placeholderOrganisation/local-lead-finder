<!DOCTYPE html>
<html lang="en" data-design="1" data-page="about">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About — Site preview</title>
  <meta name="description" content="About — Site preview" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="preview-banner" id="preview-banner" role="status">Preview / mockup — not the live website</div>

  <div class="switcher" id="design-switcher" hidden>
    <div class="switcher__inner">
      <span class="switcher__label" id="switcher-label">Site preview</span>
      <div class="switcher__buttons" role="group" aria-label="Choose a design">
        <span class="switcher__hint">Design</span>
        <button type="button" class="switcher__btn" data-design-btn="1" aria-pressed="false">1</button>
        <button type="button" class="switcher__btn" data-design-btn="2" aria-pressed="false">2</button>
        <button type="button" class="switcher__btn" data-design-btn="3" aria-pressed="false">3</button>
      </div>
    </div>
  </div>

  <header class="site-header" id="site-header">
    <div class="site-header__inner container">
      <a class="brand" id="logo" href="index.html" aria-label="Home"></a>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>
      <nav class="primary-nav" id="primary-nav" aria-label="Primary">
        <ul class="primary-nav__list" id="nav-list"></ul>
        <a class="btn btn--primary primary-nav__cta" id="header-cta" href="index.html#contact"></a>
      </nav>
    </div>
  </header>

  <main id="main">

    <!-- 1. PAGE HERO -->
    <section class="page-hero" id="about-hero" aria-labelledby="about-hero-title">
      <div class="container">
        <p class="kicker" id="about-hero-kicker" hidden></p>
        <h1 class="page-hero__title" id="about-hero-title"></h1>
        <p class="page-hero__lead" id="about-hero-lead" hidden></p>
      </div>
    </section>

    <!-- 2. STORY -->
    <section class="section story" id="about-story" aria-label="Our story">
      <div class="container story__grid">
        <div class="story__body" id="story-body"></div>
        <aside class="story__stats" id="story-stats" hidden></aside>
      </div>
    </section>

    <!-- 3. OWNER -->
    <section class="section owner" id="about-owner-section" hidden aria-label="Leadership">
      <div class="container owner__inner">
        <span class="avatar avatar--lg" id="about-owner-initials" aria-hidden="true"></span>
        <div>
          <p class="owner__name" id="about-owner-name"></p>
          <p class="owner__title" id="about-owner-title"></p>
          <p class="owner__cred" id="about-owner-cred"></p>
        </div>
      </div>
    </section>

    <!-- 4. VALUES -->
    <section class="section values" id="about-values" hidden aria-labelledby="values-heading">
      <div class="container">
        <div class="section__head">
          <h2 class="section__title" id="values-heading">What we value</h2>
        </div>
        <div class="value-grid" id="values-grid"></div>
      </div>
    </section>

    <!-- 5. CREDENTIALS + SERVICE AREAS -->
    <section class="section creds" id="about-creds" hidden aria-labelledby="creds-heading">
      <div class="container creds__grid">
        <div class="creds__block" id="creds-block" hidden>
          <h2 class="section__title section__title--sm" id="creds-heading">Credentials</h2>
          <ul class="credrow credrow--lg" id="creds-list"></ul>
        </div>
        <div class="creds__block" id="areas-block" hidden>
          <h2 class="section__title section__title--sm">Areas we serve</h2>
          <ul class="arealist" id="areas-list"></ul>
        </div>
      </div>
    </section>

    <!-- 6. CTA BAND -->
    <section class="section cta-band" id="about-cta" aria-labelledby="about-cta-heading">
      <div class="container cta-band__inner">
        <div>
          <h2 class="section__title" id="about-cta-heading"></h2>
          <p class="section__intro" id="about-cta-body" hidden></p>
        </div>
        <div class="cta-band__actions">
          <a class="btn btn--primary" id="about-cta-primary" href="index.html#contact"></a>
          <a class="btn btn--ghost" id="about-cta-secondary" href="index.html#contact"></a>
        </div>
        <ul class="cta-band__contact" id="about-cta-contact"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer">
    <div class="container site-footer__grid">
      <div class="site-footer__col">
        <span class="brand brand--footer" id="footer-logo"></span>
        <p class="site-footer__blurb" id="footer-blurb"></p>
        <ul class="credrow" id="footer-creds" hidden></ul>
      </div>
      <div class="site-footer__col">
        <h3 class="site-footer__title">Services</h3>
        <ul class="site-footer__list" id="footer-services"></ul>
      </div>
      <div class="site-footer__col">
        <h3 class="site-footer__title">Contact</h3>
        <ul class="site-footer__list" id="footer-contact"></ul>
      </div>
    </div>
    <div class="site-footer__base">
      <div class="container site-footer__base-inner">
        <p id="footer-copy"></p>
        <p class="site-footer__legal" id="footer-legal"></p>
      </div>
    </div>
  </footer>

  <a class="callbar" id="callbar" href="tel:" hidden>
    <span class="callbar__icon" aria-hidden="true"></span>
    <span id="callbar-label">Call now</span>
  </a>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
